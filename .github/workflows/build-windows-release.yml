name: Build PD Uploader 0.3.1 (Windows)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate application files
        id: source
        shell: pwsh
        run: |
          if (Test-Path 'PD_Uploader_0.3.1/pyproject.toml') {
            $sourceDir = 'PD_Uploader_0.3.1'
          } elseif (Test-Path 'pyproject.toml') {
            $sourceDir = '.'
          } else {
            throw 'Upload the PD_Uploader_0.3.1 folder or its contents first.'
          }
          "directory=$sourceDir" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        working-directory: ${{ steps.source.outputs.directory }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Test isolated Edge window minimization
        working-directory: ${{ steps.source.outputs.directory }}
        run: python tests/edge_window_smoke.py

      - name: Build folder app
        working-directory: ${{ steps.source.outputs.directory }}
        run: pyinstaller --noconfirm control_room_uploader.spec

      - name: Check packaged application starts and closes
        working-directory: ${{ steps.source.outputs.directory }}
        shell: pwsh
        run: |
          $appPath = (Resolve-Path 'dist/PDUploader-0.3.1/PDUploader-0.3.1.exe').Path
          $testApp = Start-Process -FilePath $appPath -ArgumentList '--smoke-test' -PassThru
          if (-not $testApp.WaitForExit(30000)) {
            Stop-Process -Id $testApp.Id -Force
            throw 'Packaged application did not finish its startup smoke test.'
          }
          if ($testApp.ExitCode -ne 0) { throw "Application startup failed: $($testApp.ExitCode)" }

      - name: Zip folder app
        working-directory: ${{ steps.source.outputs.directory }}
        shell: pwsh
        run: Compress-Archive -Path 'dist/PDUploader-0.3.1' -DestinationPath 'dist/PDUploader-0.3.1-windows.zip' -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PDUploader-0.3.1-windows
          path: ${{ steps.source.outputs.directory }}/dist/PDUploader-0.3.1
          if-no-files-found: error
