[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-room-image-uploader"
version = "0.3.1"
description = "Small Windows app for uploading JPG files to a Control Room Site Images panel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45,<2", "PySide6-Essentials==6.8.3"]

[project.gui-scripts]
control-room-image-uploader = "control_room_uploader.app:main"

[tool.setuptools.packages.find]
where = ["src"]
